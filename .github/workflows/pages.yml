# Website on GitHub Pages: site/ plus the README pictures (tools/site/build.sh), deployed on every
# push to main that touches them. Pages source in the repo settings: "GitHub Actions".
name: Website
on:
  push:
    branches: [main]
    paths: [site/**, docs/readme/**, assets/icon/**, tools/site/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: macos-latest   # sips (icon size) is macOS only
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/site/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
