<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found | SpaceDock</title>
<link rel="icon" type="image/png" href="/SpaceDock/img/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #FFFFFF; --text: #000000; --muted: #666666; --line: #E5E5E5; --ease: cubic-bezier(0.22, 1, 0.36, 1); }
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #FFFFFF; --muted: #9B9B9B; --line: #313131; } }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--bg); color: var(--text);
  font-family: "Geist", system-ui, sans-serif; font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
img { width: 96px; height: 96px; margin: 0 auto 24px; display: block; }
h1 { font-size: 36px; line-height: 40px; font-weight: 600; text-wrap: balance; }
p { margin-top: 16px; color: var(--muted); text-wrap: pretty; }
a { display: inline-block; margin-top: 32px; padding: 8px 12px; border-radius: 8px; background: var(--text); color: var(--bg); font-weight: 600; text-decoration: none;
  transition: opacity 300ms var(--ease); }
a:hover { opacity: 0.85; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <img src="/SpaceDock/img/icon.png" alt="SpaceDock icon">
  <h1>This Space is not in the layout</h1>

</main>
</body>
